<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Each All</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <h1>Each All</h1>

    <div id="prompt-grid">
        <!-- Placeholder: in the future, dynamically populate from prompts.json -->
        <button onclick="openPrompt('001')">Prompt 001</button>
        <button onclick="openPrompt('002')">Prompt 002</button>
        <button onclick="openPrompt('003')">Prompt 003</button>
    </div>

    <div id="submission-modal" style="display: none;">
        <h2 id="prompt-title">Submit your image</h2>
        <input type="file" id="image-input" accept="image/*" /><br />
        <textarea id="caption-input" placeholder="Add a caption (optional)"></textarea><br />
        <button onclick="handleSubmit()">Submit</button>
        <button onclick="closeModal()">Cancel</button>
    </div>

    <script src="script.js"></script>
    <script>
        let currentPromptId = "";

        function openPrompt(promptId) {
            currentPromptId = promptId;
            document.getElementById("submission-modal").style.display = "block";
        }

        function closeModal() {
            document.getElementById("submission-modal").style.display = "none";
        }

        function handleSubmit() {
            const fileInput = document.getElementById("image-input");
            const captionInput = document.getElementById("caption-input");
            submitImage(currentPromptId, fileInput, captionInput);
        }
    </script>
</body>

</html>
