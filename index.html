<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EACH ALL</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <h1>EACH ALL</h1>

    <div id="prompt-grid"></div>

    <div id="submission-modal" style="display: none;">
        <h2 id="prompt-title">Submit your image</h2>
        <input type="file" id="image-input" accept="image/*" /><br />
        <textarea id="caption-input" placeholder="Add a caption (optional)"></textarea><br />
        <button id="submit-button">Submit</button>
        <button id="cancel-button">Cancel</button>
        <div id="submissions-container" style="margin-top: 1em;"></div>
    </div>

    <script src="script.js"></script>
</body>

</html>
