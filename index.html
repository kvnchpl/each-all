<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EACH ALL</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <h1>EACH ALL<span id="about-button">*</span></h1>
    <div id="sort-controls">
        <div class="control-button" id="sort-popular-button">Sort by Popularity</div>
        <div class="control-button" id="sort-id-button">Sort by ID</div>
    </div>

    <div id="prompt-grid"></div>

    <div id="submission-modal" class="modal">
        <div class="modal-content">
            <div id="modal-header">
                <div class="modal-top flex-col">
                    <button id="return-button" class="modal-button">&#8592;</button>
                    <button id="randomize-button" class="modal-button">&#9733;</button>
                    <div id="prompt-text"></div>
                </div>
                <div class="modal-bottom flex-col">
                    <form id="submission-form">
                        <input type="text" id="username-input" class="modal-input" placeholder="username" />
                        <label for="image-input" id="file-label" class="modal-button">choose file</label>
                        <input type="file" id="image-input" accept="image/*" style="display: none;" />
                        <div id="filename-preview"></div>
                        <input type="text" id="caption-input" class="modal-input"
                            placeholder="add a caption (optional)" />
                        <button id="submit-button" class="modal-button">submit</button>
                    </form>
                </div>
            </div>
            <button id="toggle-header" type="button" class="modal-button">&#8593;</button>
            <div id="submissions-container"></div>
        </div>
    </div>

    <div id="about-modal" class="modal">
        <div class="modal-content">
            <div id="about-content" class="flex-col">
                <button id="about-close" class="modal-button">&#8592;</button>
                <p>
                    <span class="uppercase">EACH ALL</span> is an image-sharing and collaging experiment exploring
                    collective
                    meaning-making. Submit your own images and be inspired by others.
                </p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
