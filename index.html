<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EACH ALL</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <h1>EACH ALL<span id="about-button">*</span></h1>

    <div id="prompt-grid"></div>

    <div id="submission-modal" class="modal">
        <div id="modal-header">
            <div class="modal-top">
                <button id="return-button" class="modal-button">&#8592;</button>
                <button id="randomize-button" class="modal-button">&#9733;</button>
                <div id="prompt-text"></div>
            </div>
            <div class="modal-bottom">
                <input type="text" id="username-input" class="modal-input" placeholder="username" />
                <input type="text" id="caption-input" class="modal-input" placeholder="add a caption (optional)" />
                <label for="image-input" id="file-label" class="modal-button">choose file</label>
                <input type="file" id="image-input" accept="image/*" style="display: none;" />
                <div id="filename-preview"></div>
                <button id="submit-button" class="modal-button">submit</button>
            </div>
        </div>
        <div id="submissions-container"></div>
    </div>

    <div id="about-modal" class="modal">
        <div id="about-content">
            <button id="about-close" class="modal-button">&#8592;</button>
            <p>
                <span class="uppercase">EACH ALL</span> is a collective image-sharing experiment exploring prompts and
                randomness in a web 1.0 style space. Submit your own images and see how others respond.
            </p>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
