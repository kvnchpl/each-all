<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EACH ALL</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <h1>EACH ALL</h1>

    <div id="prompt-grid"></div>

    <div id="submission-modal" style="display: none;">
        <div id="modal-header">
            <div id="prompt-text"></div>
            <div id="seed-display"></div>
            <input type="text" id="username-input" placeholder="Username" />
            <textarea id="caption-input" placeholder="Add a caption (optional)"></textarea>
            <input type="file" id="image-input" accept="image/*" />
            <div id="button-container">
                <button id="submit-button">Submit</button>
                <button id="cancel-button">Cancel</button>
            </div>
        </div>
        <div id="submissions-container" style="margin-top: 1em;"></div>
    </div>

    <script src="script.js"></script>
</body>

</html>
